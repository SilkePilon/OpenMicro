# SEPARATE workspace on purpose: this table makes Cargo treat `firmware/`
# as its own workspace root, so the ROOT repo's `cargo build|test|clippy
# --workspace` (run from the repo root Cargo.toml) never discovers or
# builds this crate. It is only ever built by invoking cargo from inside
# `firmware/` itself, once the Xtensa toolchain (see README.md) is
# installed.
[workspace]
members = ["."]

[package]
name = "openmicro-fw"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "openmicro-fw"
path = "src/main.rs"
test = false
doctest = false
bench = false

# --- Version pinning rationale --------------------------------------------
# This set is copied 1:1 from the esp-hal repo's own BLE example at the
# `esp-hal-v1.1.1` release tag (`examples/ble/bas_peripheral/Cargo.toml`),
# where every in-tree crate version equals the published crates.io version
# (verified against the tag's per-crate Cargo.toml files). That example is
# the closest thing to a vendor-blessed "Embassy + TrouBLE on ESP32-S3"
# manifest, so the whole graph is known to resolve AND compile together.
#
# esp-hal 1.1.1        : latest stable, ESP32-S3 support.
# esp-rtos 0.3.0       : REPLACES esp-hal-embassy. esp-hal-embassy's last
#                        release (0.9.1, Oct 2025) targets esp-hal
#                        1.0.0-rc.x and does not compile against esp-hal
#                        1.1.x (imports the removed `esp_hal::sync::Locked`;
#                        `RawPriorityLimitedMutex` no longer implements
#                        embassy-sync's `RawMutex`). Upstream moved the
#                        embassy executor/time-driver integration into
#                        esp-rtos (`embassy` feature, `#[esp_rtos::main]`,
#                        `esp_rtos::start(...)`), which tracks esp-hal
#                        ~1.1.0-rc.0. The `esp-radio` feature provides the
#                        scheduler esp-radio 0.18 requires.
# embassy-executor 0.10.0: what esp-rtos 0.3.0's `embassy` feature pins
#                        (^0.10); one executor instance in the graph.
# embassy-time 0.5.0   : ditto (esp-rtos drives embassy-time-driver 0.2);
#                        also satisfies trouble-host 0.6.0's ^0.5.
# embassy-sync 0.7     : trouble-host 0.6.0 needs ^0.7 (the bas_peripheral
#                        example carries the same "TODO: update once trouble
#                        supports 0.8" pin). Only used for our own channels,
#                        so the 0.7-vs-0.8 split with esp-rtos' internal
#                        embassy-sync 0.8 is harmless (different types,
#                        never exchanged).
# esp-radio 0.18.0     : matches esp-hal ~1.1.0-rc.0 and esp-rtos 0.3.0
#                        (via esp-radio-rtos-driver 0.3). `ble` pulls in
#                        bt-hci 0.8 and esp-hal's `__bluetooth`; `unstable`
#                        is required for the ble feature set. 1.0.0-beta.0
#                        exists but is a beta with no matching example tag.
# trouble-host 0.6.0   : NOT the crates.io-latest (0.7.0). 0.7.0 requires
#                        `bt-hci ^0.9`, which conflicts with esp-radio
#                        0.18.0's `bt-hci ^0.8.0` pin (confirmed from both
#                        crates' published Cargo.toml — these ranges do not
#                        overlap). 0.6.0 requires `bt-hci ^0.8`, matching.
#                        Default features (peripheral/central/gatt/derive/
#                        default-packet-pool) as in the example; bt-hci is
#                        reached through trouble_host::prelude, so no direct
#                        bt-hci dependency is needed here.
# esp-bootloader-esp-idf 0.5.0: NEW requirement of the esp-hal 1.1 boot
#                        flow — the app must embed an ESP-IDF app descriptor
#                        (`esp_bootloader_esp_idf::esp_app_desc!()` in
#                        main.rs) for the 2nd-stage bootloader/espflash.
# esp-println 0.17.0   : the old per-backend feature dance is gone; the
#                        default `auto` feature picks the right output for
#                        the chip (USB-Serial-JTAG on the S3 — the Micro 2's
#                        only host link; it has no UART header).
# esp-backtrace 0.19.0 : matches esp-println 0.17 (its ^0.17 pin).
# esp-hal-smartled     : deliberately NOT used. 0.17.0 (its latest release)
#                        pins esp-hal to "~1.0" (i.e. <1.1.0), which
#                        conflicts with esp-radio's floor of >=1.1.0-rc.0.
#                        WS2812 is instead driven directly over
#                        `esp_hal::rmt` in `leds.rs` (part of esp-hal
#                        itself, so it can never skew independently).
[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio", "log-04"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.7"
embassy-futures = "0.1"
esp-radio = { version = "0.18.0", features = ["esp32s3", "ble", "unstable", "log-04"] }
# Default features include `peripheral` + `gatt` (+ central/derive/packet
# pool): the macropad advertises and serves the OpenMicro GATT service; the
# host daemon is the central. `default-packet-pool-mtu-255` sizes pool
# packets to one full ATT payload, per the upstream bas_peripheral example.
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-255"] }
esp-alloc = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
log = "0.4"
# `SpiBus::write` — esp-hal implements the embedded-hal 1.0 traits rather
# than exposing an inherent blocking write.
embedded-hal = "1.0"
static_cell = "2.1.0"
heapless = "0.9"

openmicro-proto = { path = "../crates/openmicro-proto", default-features = false }
openmicro-effects = { path = "../crates/openmicro-effects" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true       # keep symbols for panic backtraces / espflash; strip later if flash size is tight
overflow-checks = false
