[workspace]
resolver = "2"
members = [
    "crates/openmicro-proto",
    "crates/openmicrod",
    "crates/openmicro",
    "crates/openmicro-hook",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
